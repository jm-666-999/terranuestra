<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4f">
<title>TerraNuestra Admin</title>
<style>
:root{
  --verde:#1f6b4f;
  --verde-2:#2e8b67;
  --verde-claro:#e9f5ef;
  --amarillo:#f4b942;
  --rojo:#c94b4b;
  --azul:#3978a8;
  --texto:#18322a;
  --sub:#6b7d76;
  --fondo:#f5f7f6;
  --blanco:#fff;
  --borde:#dfe8e3;
  --sombra:0 8px 25px rgba(20,50,40,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--fondo);color:var(--texto)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#edf7f1,#f8faf9)}
.login-card{width:min(430px,100%);background:white;border:1px solid var(--borde);border-radius:24px;padding:32px;box-shadow:var(--sombra)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo-mark{width:48px;height:48px;border-radius:14px;background:var(--verde);display:grid;place-items:center;color:white;font-size:25px}
.logo h1{font-size:23px;margin:0}.logo p{margin:3px 0 0;color:var(--sub);font-size:13px}
.login-card h2{margin:0 0 7px;font-size:25px}
.login-card .intro{margin:0 0 22px;color:var(--sub);font-size:14px}
.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--borde);border-radius:12px;outline:none;background:white}
.field input:focus,.field select:focus{border-color:var(--verde-2);box-shadow:0 0 0 3px rgba(46,139,103,.1)}
.primary{width:100%;border:0;background:var(--verde);color:white;border-radius:12px;padding:14px;font-weight:800;margin-top:5px}
.demo{margin-top:16px;background:var(--verde-claro);border-radius:12px;padding:12px;font-size:12px;color:#2f5b49}
.error{margin:0 0 13px;padding:11px;border-radius:10px;background:#fdeeee;color:#a63737;font-size:13px}

/* APP */
#app{min-height:100vh}
.topbar{height:64px;background:white;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.top-left{display:flex;align-items:center;gap:11px}.hamb{border:0;background:#f1f5f3;width:40px;height:40px;border-radius:11px;font-size:19px}
.top-title{font-weight:850}.top-sub{font-size:11px;color:var(--sub)}
.user-mini{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--verde-claro);display:grid;place-items:center;font-weight:800;color:var(--verde)}

.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--borde);padding:18px 12px;flex-shrink:0}
.side-label{text-transform:uppercase;color:#94a49e;font-size:10px;font-weight:800;padding:10px 12px}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;color:#4b6259;font-weight:650;display:flex;align-items:center;gap:11px;margin:3px 0}
.nav-btn:hover,.nav-btn.active{background:var(--verde-claro);color:var(--verde)}
.logout{margin-top:18px;border-top:1px solid var(--borde);padding-top:15px}
.content{flex:1;padding:22px;min-width:0}
.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}
.page-head h1{margin:0;font-size:26px}.page-head p{margin:5px 0 0;color:var(--sub);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750}
.btn.green{background:var(--verde);color:white}.btn.gray{background:#edf2ef;color:#36564a}.btn.red{background:#fdecec;color:#a83838}
.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));display:grid;gap:15px}
.card{background:white;border:1px solid var(--borde);border-radius:16px;padding:17px;box-shadow:0 3px 12px rgba(20,50,40,.03)}
.kpi-label{color:var(--sub);font-size:12px}.kpi-value{font-size:27px;font-weight:850;margin-top:7px}.kpi-note{font-size:11px;color:var(--sub);margin-top:4px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:15px}
.card h3{margin:0 0 13px;font-size:16px}
.alert{display:flex;gap:10px;padding:11px;border-radius:11px;background:#fff7e5;margin-top:8px;font-size:13px}
.alert.red{background:#fdeeee}.alert.green{background:var(--verde-claro)}
.alert small{display:block;color:var(--sub);margin-top:2px}

.table-wrap{overflow:auto;background:white;border:1px solid var(--borde);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf1ef;font-size:13px}
th{font-size:11px;text-transform:uppercase;color:#7c8c86;background:#fbfcfb}
tr:last-child td{border-bottom:0}
.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef3f0;color:#4c665c}
.status.green{background:#e7f5ed;color:#27704e}.status.yellow{background:#fff4d8;color:#946d16}.status.red{background:#fdeaea;color:#a93a3a}.status.blue{background:#eaf3fa;color:#32688f}
.searchbar{display:flex;gap:9px;margin-bottom:13px}.searchbar input{flex:1;border:1px solid var(--borde);border-radius:11px;padding:11px 13px}
.empty{padding:35px;text-align:center;color:var(--sub)}
.notice{font-size:12px;background:#f2f6f4;border-radius:11px;padding:11px;margin-top:12px;color:#50675e}
.modal-back{position:fixed;inset:0;background:rgba(10,25,19,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-back.open{display:flex}.modal{background:white;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0f3f1;border-radius:9px;width:35px;height:35px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
.toast{position:fixed;right:18px;bottom:18px;background:#17382c;color:white;padding:12px 15px;border-radius:11px;display:none;z-index:80;font-size:13px}
.toast.show{display:block}

/* MOBILE */
@media(max-width:850px){
  .sidebar{position:fixed;left:-270px;top:64px;bottom:0;z-index:30;transition:.2s;box-shadow:var(--sombra)}
  .sidebar.open{left:0}
  .content{padding:16px}.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
}
@media(max-width:560px){
  .top-sub{display:none}.user-mini span{display:none}
  .page-head{display:block}.actions{margin-top:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}
  .kpi-value{font-size:22px}
  .form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}
  .login-card{padding:24px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-card">
    <div class="logo">
      <div class="logo-mark">🌱</div>
      <div>
        <h1>TerraNuestra</h1>
        <p>Panel administrativo</p>
      </div>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="intro">Acceso exclusivo para administradores de TerraNuestra.</p>

    <div id="loginError" class="error hidden"></div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="admin@terranuestra.com" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="primary" onclick="login()">INICIAR SESIÓN</button>

    <div class="demo">
      <b>Modo demostración</b><br>
      Usuario: admin@terranuestra.com<br>
      Contraseña: 123456
    </div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header class="topbar">
    <div class="top-left">
      <button class="hamb" onclick="toggleMenu()">☰</button>
      <div>
        <div class="top-title">TerraNuestra</div>
        <div class="top-sub">Panel administrativo</div>
      </div>
    </div>
    <div class="user-mini">
      <span id="userName">Administrador</span>
      <div class="avatar">A</div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="side-label">Administración</div>
      <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" data-page="pedidos" onclick="showPage('pedidos')">🧾 Pedidos</button>
      <button class="nav-btn" data-page="inventario" onclick="showPage('inventario')">📦 Inventario</button>
      <button class="nav-btn" data-page="compras" onclick="showPage('compras')">📄 Compras / Excel</button>
      <button class="nav-btn" data-page="productos" onclick="showPage('productos')">🍎 Productos</button>
      <button class="nav-btn" data-page="clientes" onclick="showPage('clientes')">🏢 Clientes</button>
      <button class="nav-btn" data-page="proveedores" onclick="showPage('proveedores')">🚚 Proveedores</button>
      <button class="nav-btn" data-page="reportes" onclick="showPage('reportes')">📈 Reportes</button>
      <div class="logout">
        <button class="nav-btn" onclick="logout()">↪ Cerrar sesión</button>
      </div>
    </aside>

    <main id="content" class="content"></main>
  </div>
</section>

<div id="modalBack" class="modal-back">
  <div id="modal" class="modal"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/*
  TERRANUESTRA ADMIN - PROTOTIPO
  --------------------------------
  Esta primera versión usa datos locales para poder probar la APK.
  NO es todavía una autenticación/base de datos de producción.
  Próximo paso: conectar Supabase Auth + PostgreSQL.
*/

const demoUser = {
  email: "admin@terranuestra.com",
  password: "123456",
  name: "Administrador TerraNuestra"
};

const state = {
  page: "dashboard",
  pedidos: [
    {id:"TN-1005",cliente:"Restaurante La Cosecha",total:485000,fecha:"03/10/2026",estado:"Pendiente"},
    {id:"TN-1004",cliente:"Supermercado Central",total:720000,fecha:"03/10/2026",estado:"Confirmado"},
    {id:"TN-1003",cliente:"Hotel Verde",total:315000,fecha:"02/10/2026",estado:"En preparación"},
    {id:"TN-1002",cliente:"Cafetería El Parque",total:198000,fecha:"02/10/2026",estado:"Entregado"}
  ],
  productos: [
    {id:1,nombre:"Papa",categoria:"Tubérculos",unidad:"kg",stock:30,min:20,precio:3800},
    {id:2,nombre:"Tomate",categoria:"Verduras",unidad:"kg",stock:15,min:20,precio:3800},
    {id:3,nombre:"Cebolla",categoria:"Verduras",unidad:"kg",stock:45,min:15,precio:4200},
    {id:4,nombre:"Aguacate",categoria:"Frutas",unidad:"kg",stock:8,min:10,precio:7200},
    {id:5,nombre:"Zanahoria",categoria:"Hortalizas",unidad:"kg",stock:50,min:15,precio:3500},
    {id:6,nombre:"Limón",categoria:"Frutas",unidad:"kg",stock:0,min:10,precio:4600}
  ],
  clientes: [
    {nombre:"Restaurante La Cosecha",tipo:"Restaurante",contacto:"Carlos Pérez",telefono:"300 000 0001",estado:"Activo"},
    {nombre:"Supermercado Central",tipo:"Supermercado",contacto:"Laura Gómez",telefono:"300 000 0002",estado:"Activo"},
    {nombre:"Hotel Verde",tipo:"Hotel",contacto:"Andrés Ruiz",telefono:"300 000 0003",estado:"Activo"},
    {nombre:"Cafetería El Parque",tipo:"Cafetería",contacto:"María López",telefono:"300 000 0004",estado:"Activo"}
  ],
  proveedores: [
    {empresa:"Proveedor Agrícola Central",contacto:"Jorge",telefono:"300 000 0010",categoria:"Verduras"},
    {empresa:"Distribuciones del Valle",contacto:"Ana",telefono:"300 000 0011",categoria:"Frutas"}
  ],
  compras: [
    {producto:"Uva verde sin semilla",categoria:"Fruta",cantidad:10,unidad:"Caja",unitario:230000,total:2300000},
    {producto:"Cebolla cabezona",categoria:"Verdura",cantidad:15,unidad:"Bulto",unitario:125000,total:1875000},
    {producto:"Tomate",categoria:"Verdura",cantidad:20,unidad:"Bulto",unitario:95000,total:1900000},
    {producto:"Papa",categoria:"Verdura",cantidad:30,unidad:"Bulto",unitario:85000,total:2550000}
  ]
};

function money(n){ return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n); }
function stockStatus(p){
  if(p.stock===0) return ["Agotado","red"];
  if(p.stock<p.min) return ["Stock bajo","yellow"];
  return ["Suficiente","green"];
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}
function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const err=document.getElementById("loginError");
  if(email===demoUser.email && password===demoUser.password){
    localStorage.setItem("tn_admin_session","demo");
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userName").textContent=demoUser.name;
    showPage("dashboard");
  }else{
    err.textContent="Correo o contraseña incorrectos.";
    err.classList.remove("hidden");
  }
}
function logout(){
  localStorage.removeItem("tn_admin_session");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value="";
}
function toggleMenu(){ document.getElementById("sidebar").classList.toggle("open"); }
function showPage(page){
  state.page=page;
  document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.getElementById("sidebar").classList.remove("open");
  const pages={dashboard:dashboard,pedidos:pedidos,inventario:inventario,compras:compras,productos:productos,clientes:clientes,proveedores:proveedores,reportes:reportes};
  document.getElementById("content").innerHTML=pages[page]();
}

function head(title,sub,actions=""){
  return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
}

function dashboard(){
  const ventas=state.pedidos.filter(p=>p.estado!=="Cancelado").reduce((a,p)=>a+p.total,0);
  const bajos=state.productos.filter(p=>p.stock<p.min);
  return head("Dashboard","Resumen de la operación administrativa.",
  `<button class="btn gray" onclick="showPage('compras')">📄 Ver compras</button>`) +
  `<div class="kpis">
    <div class="card"><div class="kpi-label">Pedidos</div><div class="kpi-value">${state.pedidos.length}</div><div class="kpi-note">${state.pedidos.filter(p=>p.estado==="Pendiente").length} pendientes</div></div>
    <div class="card"><div class="kpi-label">Ventas registradas</div><div class="kpi-value">${money(ventas)}</div><div class="kpi-note">Pedidos no cancelados</div></div>
    <div class="card"><div class="kpi-label">Productos</div><div class="kpi-value">${state.productos.length}</div><div class="kpi-note">${bajos.length} requieren reposición</div></div>
    <div class="card"><div class="kpi-label">Clientes</div><div class="kpi-value">${state.clientes.length}</div><div class="kpi-note">Empresas registradas</div></div>
  </div>
  <div class="two">
    <div class="card">
      <h3>Últimos pedidos</h3>
      ${state.pedidos.slice(0,5).map(p=>`<div class="alert green" style="background:#fff;border:1px solid var(--borde)">
        <div style="flex:1"><b>${p.id} · ${p.cliente}</b><small>${p.fecha} · ${money(p.total)}</small></div>
        <span class="status ${statusClass(p.estado)}">${p.estado}</span>
      </div>`).join("")}
    </div>
    <div class="card">
      <h3>Alertas de inventario</h3>
      ${bajos.length ? bajos.map(p=>{
        const s=stockStatus(p);
        return `<div class="alert ${s[1]==="red"?"red":""}"><span>${s[1]==="red"?"⚫":"🔴"}</span><div><b>${p.nombre}</b><small>${p.stock===0?"Agotado":`Quedan ${p.stock} ${p.unidad}; mínimo ${p.min}`}</small></div></div>`;
      }).join("") : `<div class="alert green"><span>🟢</span><div><b>Todo en orden</b><small>No hay productos por debajo del mínimo.</small></div></div>`}
      <button class="btn green" style="margin-top:12px" onclick="showPage('inventario')">Ir al inventario</button>
    </div>
  </div>`;
}

function statusClass(s){
  if(s==="Entregado")return"green";
  if(s==="Pendiente")return"yellow";
  if(s==="En preparación")return"blue";
  if(s==="Cancelado")return"red";
  return"";
}

function pedidos(){
  return head("Pedidos","Consulta y cambia el estado de los pedidos.",
    `<button class="btn green" onclick="addPedido()">+ Nuevo pedido</button>`) +
  `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
  ${state.pedidos.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.cliente}</td><td>${p.fecha}</td><td>${money(p.total)}</td>
  <td><select onchange="changeOrder('${p.id}',this.value)">
    ${["Pendiente","Confirmado","En preparación","Listo para despacho","En camino","Entregado","Cancelado"].map(x=>`<option ${x===p.estado?"selected":""}>${x}</option>`).join("")}
  </select></td>
  <td><button class="btn gray" onclick="viewOrder('${p.id}')">Ver</button></td></tr>`).join("")}
  </tbody></table></div>`;
}
function changeOrder(id,val){
  const p=state.pedidos.find(x=>x.id===id); if(!p)return;
  p.estado=val; toast(`Pedido ${id}: ${val}`);
  showPage("pedidos");
}
function viewOrder(id){
  const p=state.pedidos.find(x=>x.id===id);
  openModal(`<div class="modal-head"><h3>Pedido ${p.id}</h3><button class="close" onclick="closeModal()">×</button></div>
  <p><b>Cliente:</b> ${p.cliente}<br><b>Fecha:</b> ${p.fecha}<br><b>Total:</b> ${money(p.total)}</p>
  <div class="notice">Este pedido es una demostración. Más adelante se conectará con la base de datos central.</div>`);
}
function addPedido(){
  openModal(`<div class="modal-head"><h3>Nuevo pedido</h3><button class="close" onclick="closeModal()">×</button></div>
  <div class="form-grid">
    <div class="field full"><label>Cliente</label><input id="newClient" placeholder="Nombre del negocio"></div>
    <div class="field"><label>Total</label><input id="newTotal" type="number" placeholder="0"></div>
    <div class="field"><label>Fecha</label><input id="newDate" value="03/10/2026"></div>
  </div>
  <button class="btn green" style="width:100%" onclick="savePedido()">Crear pedido</button>`);
}
function savePedido(){
  const cliente=document.getElementById("newClient").value.trim();
  const total=Number(document.getElementById("newTotal").value)||0;
  if(!cliente){toast("Escribe el cliente");return}
  const id="TN-"+(1006+state.pedidos.length);
  state.pedidos.unshift({id,cliente,total,fecha:document.getElementById("newDate").value,estado:"Pendiente"});
  closeModal();showPage("pedidos");toast("Pedido creado");
}

function inventario(){
  return head("Inventario","Control de existencias y reposición.",
    `<button class="btn gray" onclick="showPage('compras')">📄 Compras / Excel</button>`) +
  `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Unidad</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th>Ajustar</th></tr></thead><tbody>
  ${state.productos.map(p=>{const s=stockStatus(p);return `<tr>
    <td><b>${p.nombre}</b></td><td>${p.categoria}</td><td>${p.unidad}</td><td><b>${p.stock}</b></td><td>${p.min}</td>
    <td><span class="status ${s[1]}">${s[0]}</span></td>
    <td><button class="btn gray" onclick="adjustStock(${p.id},-1)">−</button>
        <button class="btn gray" onclick="adjustStock(${p.id},1)">+</button></td>
  </tr>`}).join("")}</tbody></table></div>
  <div class="notice">En la versión real, estos cambios se guardarán en la base de datos central para que los vean los demás administradores.</div>`;
}
function adjustStock(id,d){
  const p=state.productos.find(x=>x.id===id); if(!p)return;
  p.stock=Math.max(0,p.stock+d); showPage("inventario"); toast(`${p.nombre}: ${p.stock} ${p.unidad}`);
}

function compras(){
  const total=state.compras.reduce((a,x)=>a+x.total,0);
  return head("Compras / Excel","Vista inicial de la información de compras que se incorporará desde el Excel.",
    `<button class="btn gray" onclick="showImportInfo()">Importar Excel</button>`) +
  `<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card"><div class="kpi-label">Valor de esta muestra</div><div class="kpi-value">${money(total)}</div></div>
    <div class="card"><div class="kpi-label">Productos</div><div class="kpi-value">${state.compras.length}</div></div>
    <div class="card"><div class="kpi-label">Fuente</div><div class="kpi-value" style="font-size:18px">Excel</div><div class="kpi-note">Pendiente de importación real</div></div>
  </div>
  <div class="card" style="margin-top:15px">
    <div class="searchbar"><input id="buySearch" placeholder="Buscar producto..." oninput="filterPurchases()"></div>
    <div id="purchaseTable"></div>
  </div>
  <div class="notice">El Excel original no se modifica. Para producción, sus datos se limpiarán y se importarán a tablas de compras, productos e inventario en la base de datos central.</div>`;
}
function renderPurchases(list=state.compras){
  document.getElementById("purchaseTable").innerHTML=`<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Cantidad</th><th>Unidad</th><th>Valor unitario</th><th>Total</th></tr></thead><tbody>
  ${list.map(x=>`<tr><td><b>${x.producto}</b></td><td>${x.categoria}</td><td>${x.cantidad}</td><td>${x.unidad}</td><td>${money(x.unitario)}</td><td><b>${money(x.total)}</b></td></tr>`).join("")}</tbody></table></div>`;
}
function filterPurchases(){
  const q=document.getElementById("buySearch").value.toLowerCase();
  renderPurchases(state.compras.filter(x=>(x.producto+x.categoria).toLowerCase().includes(q)));
}
function showImportInfo(){
  openModal(`<div class="modal-head"><h3>Importar Excel</h3><button class="close" onclick="closeModal()">×</button></div>
  <p>En la primera entrega dejamos preparado el módulo. El siguiente paso será importar el Excel real y convertirlo en datos de productos, compras e inventario.</p>
  <div class="notice"><b>Importante:</b> la importación no debe sobrescribir datos sin validación. Se hará una vista previa antes de guardar.</div>`);
}

function productos(){
  return head("Productos","Catálogo administrativo y precios.",
    `<button class="btn green" onclick="addProduct()">+ Agregar producto</button>`) +
  `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Unidad</th><th>Precio</th><th>Stock</th><th>Acción</th></tr></thead><tbody>
  ${state.productos.map(p=>`<tr><td><b>${p.nombre}</b></td><td>${p.categoria}</td><td>${p.unidad}</td><td>${money(p.precio)}</td><td>${p.stock}</td><td><button class="btn gray" onclick="editProduct(${p.id})">Editar</button></td></tr>`).join("")}
  </tbody></table></div>`;
}
function addProduct(){
  openModal(productForm());
}
function editProduct(id){
  const p=state.productos.find(x=>x.id===id); openModal(productForm(p));
}
function productForm(p={}){
  return `<div class="modal-head"><h3>${p.id?"Editar producto":"Nuevo producto"}</h3><button class="close" onclick="closeModal()">×</button></div>
  <div class="form-grid">
    <div class="field"><label>Nombre</label><input id="pfName" value="${p.nombre||""}"></div>
    <div class="field"><label>Categoría</label><input id="pfCat" value="${p.categoria||""}"></div>
    <div class="field"><label>Unidad</label><input id="pfUnit" value="${p.unidad||"kg"}"></div>
    <div class="field"><label>Precio</label><input id="pfPrice" type="number" value="${p.precio||0}"></div>
    <div class="field"><label>Stock</label><input id="pfStock" type="number" value="${p.stock||0}"></div>
    <div class="field"><label>Mínimo</label><input id="pfMin" type="number" value="${p.min||0}"></div>
  </div>
  <button class="btn green" style="width:100%" onclick="saveProduct(${p.id||0})">Guardar</button>`;
}
function saveProduct(id){
  const data={nombre:document.getElementById("pfName").value.trim(),categoria:document.getElementById("pfCat").value.trim(),unidad:document.getElementById("pfUnit").value.trim(),precio:Number(document.getElementById("pfPrice").value)||0,stock:Number(document.getElementById("pfStock").value)||0,min:Number(document.getElementById("pfMin").value)||0};
  if(!data.nombre){toast("Escribe el nombre");return}
  if(id){Object.assign(state.productos.find(x=>x.id===id),data)}else{data.id=Date.now();state.productos.push(data)}
  closeModal();showPage("productos");toast("Producto guardado");
}

function clientes(){
  return head("Clientes empresa","Negocios registrados y datos de contacto.")+
  `<div class="table-wrap"><table><thead><tr><th>Negocio</th><th>Tipo</th><th>Contacto</th><th>Teléfono</th><th>Estado</th></tr></thead><tbody>
  ${state.clientes.map(c=>`<tr><td><b>${c.nombre}</b></td><td>${c.tipo}</td><td>${c.contacto}</td><td>${c.telefono}</td><td><span class="status green">${c.estado}</span></td></tr>`).join("")}
  </tbody></table></div>`;
}
function proveedores(){
  return head("Proveedores","Proveedores y categorías de suministro.",
  `<button class="btn green" onclick="addSupplier()">+ Agregar</button>`) +
  `<div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Contacto</th><th>Teléfono</th><th>Categoría</th></tr></thead><tbody>
  ${state.proveedores.map(p=>`<tr><td><b>${p.empresa}</b></td><td>${p.contacto}</td><td>${p.telefono}</td><td>${p.categoria}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function addSupplier(){
  openModal(`<div class="modal-head"><h3>Nuevo proveedor</h3><button class="close" onclick="closeModal()">×</button></div>
  <div class="field"><label>Empresa</label><input id="sCompany"></div>
  <div class="field"><label>Contacto</label><input id="sContact"></div>
  <div class="field"><label>Teléfono</label><input id="sPhone"></div>
  <div class="field"><label>Categoría</label><input id="sCat"></div>
  <button class="btn green" style="width:100%" onclick="saveSupplier()">Guardar</button>`);
}
function saveSupplier(){
  const empresa=document.getElementById("sCompany").value.trim(); if(!empresa){toast("Escribe la empresa");return}
  state.proveedores.push({empresa,contacto:document.getElementById("sContact").value,telefono:document.getElementById("sPhone").value,categoria:document.getElementById("sCat").value});
  closeModal();showPage("proveedores");toast("Proveedor agregado");
}

function reportes(){
  const ventas=state.pedidos.filter(p=>p.estado!=="Cancelado").reduce((a,p)=>a+p.total,0);
  const top=state.productos.slice().sort((a,b)=>b.stock-a.stock).slice(0,5);
  return head("Reportes","Resumen básico para administración.",
  `<button class="btn gray" onclick="window.print()">Imprimir</button>`) +
  `<div class="two">
    <div class="card"><h3>Resumen</h3>
      <div class="alert green"><span>💰</span><div><b>Ventas registradas</b><small>${money(ventas)}</small></div></div>
      <div class="alert"><span>🧾</span><div><b>Pedidos</b><small>${state.pedidos.length} registrados</small></div></div>
      <div class="alert"><span>📦</span><div><b>Productos con stock bajo</b><small>${state.productos.filter(p=>p.stock<p.min).length}</small></div></div>
    </div>
    <div class="card"><h3>Inventario</h3>
      ${top.map(p=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1ef"><span>${p.nombre}</span><b>${p.stock} ${p.unidad}</b></div>`).join("")}
    </div>
  </div>`;
}

function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalBack").classList.add("open")}
function closeModal(){document.getElementById("modalBack").classList.remove("open")}
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !document.getElementById("loginScreen").classList.contains("hidden")) login();
});

window.addEventListener("load",()=>{
  if(localStorage.getItem("tn_admin_session")==="demo"){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userName").textContent=demoUser.name;
    showPage("dashboard");
  }
});
</script>
</body>
</html>
